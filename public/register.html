<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Library System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>📚 Create Account</h2>
      <p class="subtitle">Join the Library Management System</p>

      <div id="alert-message" class="alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="user@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" class="form-control">
            <option value="user">User (Member / Reader)</option>
            <option value="admin">Admin (Librarian / Staff)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="color: var(--accent-color); font-weight: 600;">Sign in here</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
